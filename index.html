<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <button class="menu-button" type="button" aria-label="Open menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <h1 class="title">Task Manager</h1>
        <button class="search-button" type="button" aria-label="Search tasks">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6"></circle>
            <path d="M16 16L21 21"></path>
          </svg>
        </button>
      </header>

      <label class="search-wrap" for="taskSearch">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6"></circle>
          <path d="M16 16L21 21"></path>
        </svg>
        <input id="taskSearch" class="search-bar" type="search" placeholder="Search tasks..." aria-label="Search tasks" />
      </label>

      <div class="filters" aria-label="Task filters">
        <button class="filter-btn active" type="button">All</button>
        <button class="filter-btn" type="button">Active</button>
        <button class="filter-btn" type="button">Completed</button>
      </div>

      <main id="taskList" class="task-list" aria-live="polite">
        <article class="task-card task-card--high">
          <div class="task-main">
            <button class="task-check" type="button" aria-label="Mark Study for Midterms as complete"></button>
            <div class="task-text">
              <h2 class="task-title">Study for Midterms</h2>
              <div class="task-meta-row">
                <span class="priority priority--high">High</span>
                <span class="task-date">Oct 24</span>
              </div>
            </div>
          </div>
          <div class="task-actions">
            <button class="icon-btn" type="button" aria-label="Edit task">✎</button>
            <button class="icon-btn" type="button" aria-label="Delete task">🗑</button>
          </div>
        </article>

        <article class="task-card task-card--medium">
          <div class="task-main">
            <button class="task-check" type="button" aria-label="Mark Math Homework as complete"></button>
            <div class="task-text">
              <h2 class="task-title">Math Homework</h2>
              <div class="task-meta-row">
                <span class="priority priority--medium">Medium</span>
                <span class="task-date">Oct 20</span>
              </div>
            </div>
          </div>
          <div class="task-actions">
            <button class="icon-btn" type="button" aria-label="Edit task">✎</button>
            <button class="icon-btn" type="button" aria-label="Delete task">🗑</button>
          </div>
        </article>

        <article class="task-card task-card--low is-complete">
          <div class="task-main">
            <button class="task-check checked" type="button" aria-label="Buy Groceries completed"></button>
            <div class="task-text">
              <h2 class="task-title">Buy Groceries</h2>
              <div class="task-meta-row">
                <span class="priority priority--low">Low</span>
                <span class="task-date task-date--done">Done</span>
              </div>
            </div>
          </div>
          <div class="task-actions">
            <button class="icon-btn" type="button" aria-label="Edit task">✎</button>
            <button class="icon-btn" type="button" aria-label="Delete task">🗑</button>
          </div>
        </article>
      </main>
    </div>

    <button class="fab" type="button" aria-label="Add new task">+</button>

    <div class="modal" aria-hidden="true">
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="task-modal-title">
        <h2 id="task-modal-title">Add New Task</h2>

        <form>
          <div class="form-group">
            <label for="task-title">Title</label>
            <input id="task-title" type="text" placeholder="Enter task title" />
          </div>

          <div class="form-group">
            <label for="task-description">Description</label>
            <textarea id="task-description" rows="4" placeholder="Add details about the task"></textarea>
          </div>

          <div class="form-group">
            <label for="task-due-date">Due Date</label>
            <input id="task-due-date" type="date" />
          </div>

          <div class="form-group">
            <label for="task-priority">Priority</label>
            <select id="task-priority">
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
          </div>

          <div class="form-group">
            <label for="task-category">Category</label>
            <input id="task-category" type="text" placeholder="e.g. Math, Science" />
          </div>

          <div class="form-actions">
            <button class="btn btn-secondary" type="button">Cancel</button>
            <button class="btn btn-primary" type="submit">Save Task</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
